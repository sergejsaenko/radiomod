plugins {
    id 'java-library'
    id 'net.neoforged.gradle.userdev' version '7.0.145'
    id 'maven-publish'
}

version = '1.0.1'
group = 'com.radiomod'
base.archivesName = 'radiomod'

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << '-Xlint:deprecation' << '-Xlint:unchecked'
}

// NeoForge run configurations
runs {
    configureEach {
        systemProperty 'neoforge.logging.markers', 'REGISTRIES'
        modSource project.sourceSets.main
    }
    client {
        systemProperty 'neoforge.logging.console.level', 'debug'
    }
    server {
        systemProperty 'neoforge.logging.console.level', 'debug'
        programArgument '--nogui'
    }
}

repositories {
    mavenCentral()
    maven { name = "ModMaven"; url = "https://modmaven.dev" }
}

dependencies {
    // NeoForge 1.21.1  (update to the latest recommended build at https://projects.neoforged.net/neoforged/neoforge)
    implementation "net.neoforged:neoforge:21.1.77"

    // ── Audio library (JLayer / mp3spi / tritonus) ────────────────────
    // compileOnly: provides javazoom.jl.* classes at compile time
    // jarJar:      bundles the jars inside META-INF/jarjar/ in the mod jar.
    //              NeoForge JarInJar deduplication logic:
    //                • if mp3spi (or a compatible version) is already on the
    //                  classpath (e.g. provided by another mod) → use that
    //                • otherwise → extract the bundled jar automatically
    compileOnly('com.googlecode.soundlibs:mp3spi:1.9.5.4') { transitive = true }

    jarJar('com.googlecode.soundlibs:mp3spi') {
        version {
            strictly '[1.9.5.4,2.0)'
            prefer '1.9.5.4'
        }
    }
    jarJar('com.googlecode.soundlibs:jlayer') {
        version {
            strictly '[1.0.1,2.0)'
            prefer '1.0.1.4'
        }
    }
    jarJar('com.googlecode.soundlibs:tritonus-share') {
        version {
            strictly '[0.3.7,1.0)'
            prefer '0.3.7.4'
        }
    }

    // JEI (optional integration — compile-only)
    compileOnly('mezz.jei:jei-1.21.1-neoforge-api:19.21.0.247')
}

// jarJar output = the deployable mod jar (no classifier = "radiomod-1.0.0.jar")
tasks.named('jarJar') {
    archiveClassifier = ''
}

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    // Slim jar (without embedded libs) – not for distribution
    archiveClassifier = 'slim'
    // No manual 'embed' unpacking needed — JarInJar handles it via META-INF/jarjar/
    manifest {
        attributes([
                "Specification-Title"     : "radiomod",
                "Specification-Vendor"    : "radiomod",
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : project.jar.archiveVersion,
                "Implementation-Vendor"   : "radiomod",
                "Implementation-Timestamp": new java.util.Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

